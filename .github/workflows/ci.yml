name: Java CI (Micronaut CRUD)

on:
  push:
    branches: [ "jdbc" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..40}; do
            mysqladmin ping -h 127.0.0.1 -ppassword && exit 0
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time" && exit 1

      - name: Build + Test + Shadow JAR
        env:
          MICRONAUT_DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/mn_playground
          MICRONAUT_DATASOURCES_DEFAULT_USERNAME: root
          MICRONAUT_DATASOURCES_DEFAULT_PASSWORD: password
        run: gradle clean test shadowJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/*.jar
